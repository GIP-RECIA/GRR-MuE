name: grr-mue
recipe: lamp
config:
  webroot: .
  php: '8.3'
  database: mariadb:10.11
  via: apache

services:
  appserver:
    xdebug: true
    overrides:
      environment:
        PHP_INI_memory_limit: '256M'
  database:
    overrides:
      ports:
        - "3306:3306"

tooling:
  mysql-import:
    service: database
    description: Importer un dump SQL dans la base grr